{% extends 'main/base.html' %}
{% load static %}

{% block title %}Техностарт-{{post.title}}{% endblock %}

{% block content %}

    <div class="header-choice">
        <h1>{{post.title}}</h1>
    </div>
    <div class="video-container">
        <div class="video-wrapper">
            {% if post.url_content is not NULL %}
                <iframe src="{{post.url_content}}" style="border-radius: 20px;" allow="clipboard-write; autoplay" webkitAllowFullScreen mozallowfullscreen allowFullScreen></iframe>
            {% else %}
                <img src="{% static 'profession/img/not_video.jpg'%}" alt="">
            {% endif %}
        </div>
    </div>

{% endblock %}
