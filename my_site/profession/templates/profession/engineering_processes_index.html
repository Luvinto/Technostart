{% extends 'main/base.html' %}
{% load static %}

{% block title %}Техностарт-Технологические процессы{% endblock %}
{% block content %}
    <div class="header-choice">
        <h1>Технологические процессы:</h1>
    </div>
    <div class="project-card">
            <h2 class="project-header">Проект "Альфа"</h2>
            <!-- Контейнер для карточек этапов -->
            <div class="stages-container">
                {% for eng in eng_proc %}
                    <!-- Карточка этапа -->
                    <div class="stage-card"
                        style="background-image: url('{{ eng.img.url }}');">
                        <div class="stage-title">{{ eng.title_ataps }}</div>
                        <!-- Описание или другая информация из модели eng -->
                        <div class="stage-button">Изучить</div>
                    </div>
                {% endfor %}
            </div>
    </div>
{% endblock %}
