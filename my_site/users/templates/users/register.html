{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техностарт-Регистрация</title>
    <link rel="stylesheet" href="{% static 'users/css/users.css' %}">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h2 class="form-title">Регистрация</h2>
            <form method="post" class="registration-form">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% for field in form %}
                    <div class="form-group">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <div class="error-message">
                                {% for error in field.errors %}
                                    {{ error }}
                                {% endfor %}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms-checkbox" required>
                            <a href="/users/download-consent/" target="_blank">Согласие на обработку персональных данных</a>
                    </label>
                </div>

                <!-- Кнопка регистрации (изначально скрыта) -->
                <div id="register-btn-container">
                    <button type="submit" class="btn btn-primary">
                        Зарегистрироваться
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript для отображения кнопки -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
                const checkbox = document.getElementById('terms-checkbox');
                const buttonContainer = document.getElementById('register-btn-container');

                // Проверка, что элементы существуют
                if (!checkbox || !buttonContainer) {
                    console.error('Элементы не найдены');
                    return;
                }

                // Добавляем обработчик события
                checkbox.addEventListener('change', function () {
                    console.log('Чекбокс изменён:', this.checked); // Отладка
                    if (this.checked) {
                        buttonContainer.classList.add('btn-visible');
                    } else {
                        buttonContainer.classList.remove('btn-visible');
                    }
                });

                // Дополнительно: проверяем при клике на label
                const label = checkbox.closest('label');
                if (label) {
                    label.addEventListener('click', function (e) {
                        // Убедимся, что клик не на ссылке
                        if (e.target.tagName !== 'A') {
                            setTimeout(() => {
                                console.log('Состояние чекбокса после клика:', checkbox.checked);
                            }, 10); // Небольшая задержка для обновления состояния
                        }
                    });
                }
            });
    </script>
</body>
</html>
